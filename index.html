<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<title>InCharge Watcher</title>
<style>
 :root{
  --bg:#0b0e14;--surface:rgba(255,255,255,.045);--surface-hi:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.08);--text:#f3f5f8;--muted:#8a94a6;--subtle:#596273;
  --accent:#3b82f6;--free:#22c55e;--busy:#ef4444;--warn:#f59e0b;
  --radius:16px;--ease:cubic-bezier(.22,1,.36,1);
 }
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 body{
  font-family:-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
  margin:0;background:radial-gradient(120% 80% at 50% 0%,#131b2e 0%,var(--bg) 60%) fixed;
  color:var(--text);padding-bottom:6.5rem;-webkit-font-smoothing:antialiased;
 }
 header{
  position:sticky;top:0;z-index:10;padding:1rem 1.25rem;
  background:rgba(11,14,20,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
 }
 h1{font-size:1.05rem;font-weight:600;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:.5rem}
 .wrap{max-width:540px;margin:0 auto;padding:1rem 1.1rem}
 section{margin-bottom:1.5rem}
 .sec-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 .65rem}
 section h2{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
 button{
  font-family:inherit;background:var(--accent);color:#fff;border:0;border-radius:12px;
  padding:.8rem 1.1rem;font-size:.95rem;font-weight:600;cursor:pointer;
  transition:transform .15s var(--ease),background .2s var(--ease),opacity .2s;
 }
 button:active:not(:disabled){transform:scale(.97)}
 button:disabled{opacity:.45;cursor:default}
 #locate{
  width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem;
  background:linear-gradient(180deg,#4f8ff7,#2563eb);
  box-shadow:0 8px 24px -6px rgba(37,99,235,.45),inset 0 1px 0 rgba(255,255,255,.2);
 }
 details{margin-top:.6rem}
 summary{
  font-size:.8rem;color:var(--muted);cursor:pointer;user-select:none;
  padding:.3rem .2rem;list-style:none;text-align:center;transition:color .2s;
 }
 summary::-webkit-details-marker{display:none}
 summary:hover{color:var(--text)}
 .locrow{display:flex;gap:.5rem;margin-top:.5rem}
 .locrow input{
  flex:1;min-width:0;padding:.65rem .8rem;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:.9rem;outline:none;transition:border-color .2s;
 }
 .locrow input:focus{border-color:var(--accent)}
 .card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:.95rem 1.05rem;margin-top:.65rem;
  transition:transform .2s var(--ease),background .2s var(--ease),border-color .2s;
  animation:fadeUp .28s var(--ease) both;
 }
 @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
 .row{display:flex;align-items:center;gap:.6rem}
 .badge{
  display:inline-flex;align-items:center;gap:.4rem;padding:.24rem .6rem;
  border-radius:99px;font-size:.73rem;font-weight:600;text-transform:capitalize;letter-spacing:.01em;
 }
 .dot{width:7px;height:7px;border-radius:50%;flex:none}
 .badge.free{background:rgba(34,197,94,.14);color:#4ade80}
 .badge.free .dot{background:var(--free);box-shadow:0 0 8px var(--free)}
 .badge.busy{background:rgba(239,68,68,.14);color:#f87171}
 .badge.busy .dot{background:var(--busy)}
 .badge.unknown,.badge.error{background:rgba(245,158,11,.14);color:#fbbf24}
 .badge.unknown .dot,.badge.error .dot{background:var(--warn)}
 .name{font-weight:600;font-size:.96rem;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .dist{color:var(--muted);font-size:.8rem;font-weight:500;background:rgba(255,255,255,.04);padding:.2rem .5rem;border-radius:6px}
 .meta{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin-top:.45rem}
 .addr{color:var(--muted);font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .evse{color:var(--subtle);font-size:.72rem;font-family:ui-monospace,monospace}
 .ts{color:var(--subtle);font-size:.73rem;margin-top:.25rem}
 .note{
  color:var(--muted);font-size:.84rem;text-align:center;padding:1.4rem 1rem;
  background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);
 }
 .actions{display:flex;gap:.45rem;margin-top:.75rem;align-items:center}
 .mini,.watch{
  font-size:.78rem;font-weight:500;padding:.42rem .75rem;background:var(--surface-hi);
  color:var(--muted);border:1px solid var(--border);border-radius:99px;
 }
 .mini.on{background:rgba(59,130,246,.18);color:#60a5fa;border-color:rgba(59,130,246,.4)}
 .mini.rm{margin-left:auto;padding:.42rem .65rem;color:var(--subtle)}
 .watch{margin-top:.7rem;width:100%;color:var(--text)}
 .watch.watched{background:transparent;color:var(--muted);border-style:dashed}
 .ghost{font-size:.76rem;padding:.35rem .7rem;background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:99px}
 #bar{
  position:fixed;bottom:1rem;left:1rem;right:1rem;max-width:520px;margin:0 auto;
  background:rgba(20,25,35,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.1);border-radius:18px;
  padding:.55rem .75rem;display:flex;gap:.55rem;align-items:center;
  box-shadow:0 12px 32px rgba(0,0,0,.45);
 }
 #notifbtn{font-size:.8rem;padding:.48rem .8rem;border-radius:11px;white-space:nowrap}
 #interval{
  background:var(--surface-hi);color:var(--text);border:1px solid var(--border);
  border-radius:10px;padding:.42rem .55rem;font-size:.8rem;font-family:inherit;outline:none;
 }
 #state{color:var(--muted);font-size:.76rem;margin-left:auto;text-align:right;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header>
  <h1>⚡ InCharge</h1>
  <span id="state">Ready</span>
</header>
<div class="wrap">
 <section>
  <div class="sec-head">
   <h2>Watched Chargers</h2>
   <button id="refresh" class="ghost">↻ Check now</button>
  </div>
  <div id="watch"></div>
 </section>
 <section>
  <div class="sec-head"><h2>Nearby</h2></div>
  <button id="locate">📍 Find chargers near me</button>
  <details>
   <summary>Enter coordinates manually</summary>
   <div class="locrow">
    <input id="lat" placeholder="Latitude (52.37)" inputmode="decimal">
    <input id="lon" placeholder="Longitude (4.89)" inputmode="decimal">
    <button id="go">Search</button>
   </div>
  </details>
  <div id="nearby"></div>
 </section>
</div>
<div id="bar">
  <button id="notifbtn">🔔 Alerts</button>
  <select id="interval" aria-label="Poll interval">
    <option value="30">Every 30s</option>
    <option value="60" selected>Every 1m</option>
    <option value="120">Every 2m</option>
    <option value="300">Every 5m</option>
  </select>
</div>
<script src="./app.js"></script>
</body>
</html>
